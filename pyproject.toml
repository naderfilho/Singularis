[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semente"
version = "0.1.0"
description = "SEMENTE - Cosmologia de Buracos Negros: solucao numerica, neural e visual da hipotese 'todo buraco negro e a semente de um buraco branco / Big Bang'"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nader Filho" }]
keywords = ["relatividade-geral", "buraco-negro", "buraco-branco", "cosmologia", "pinn", "ray-tracing"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "sympy>=1.12",
  "pillow>=10",
]

[project.optional-dependencies]
neural = ["torch>=2.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["semente*"]
